[package]
name = "fin-metrics-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["FreaksOnE"]
description = "Financial performance and drawdown metrics — total return, profit factor, Ulcer Index, and Martin ratio — computed with fixed-point decimal arithmetic."
license = "MIT"
repository = "https://github.com/FreaksOnE/fin-metrics-rs"
keywords = ["finance", "trading", "quant", "ulcer-index", "martin-ratio"]
categories = ["finance", "mathematics"]
readme = "README.md"

[dependencies]
rust_decimal = { version = "1.43.0", features = ["maths"] }
